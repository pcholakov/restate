[package]
name = "restate-simulation"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "Deterministic simulation testing framework for Restate"

[[bin]]
name = "simulation-stress"
path = "src/bin/stress.rs"
required-features = ["stress-bin"]

[features]
default = []
stress-bin = [
    "dep:clap",
    "dep:anyhow",
    "dep:tracing-subscriber",
    "restate-core/test-util",
    "restate-partition-store/test-util",
    "restate-rocksdb/test-util",
]

[dependencies]
restate-workspace-hack = { workspace = true }

# Restate crates
restate-clock = { workspace = true, features = ["test-util"] }
restate-core = { workspace = true, optional = true }
restate-invoker-api = { workspace = true }
restate-partition-store = { workspace = true }
restate-rocksdb = { workspace = true }
restate-service-protocol = { workspace = true, features = ["codec"] }
restate-service-protocol-v4 = { workspace = true, features = ["entry-codec"] }
restate-storage-api = { workspace = true }
restate-types = { workspace = true, features = ["test-util"] }
restate-vqueues = { workspace = true }
restate-wal-protocol = { workspace = true }
restate-worker = { workspace = true, features = ["test-util"] }

# External dependencies
anyhow = { workspace = true, optional = true }
bytes = { workspace = true }
bytestring = { workspace = true }
clap = { workspace = true, features = ["derive"], optional = true }
derive_more = { workspace = true }
futures = { workspace = true }
parking_lot = { workspace = true }
rand = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["time", "test-util"] }
tracing = { workspace = true }
tempfile = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, optional = true }

[dev-dependencies]
restate-core = { workspace = true, features = ["test-util"] }
restate-partition-store = { workspace = true, features = ["test-util"] }
restate-rocksdb = { workspace = true, features = ["test-util"] }
restate-test-util = { workspace = true }
restate-types = { workspace = true, features = ["test-util"] }

googletest = { workspace = true }
tempfile = { workspace = true }
test-log = { workspace = true }
tracing-subscriber = { workspace = true }
